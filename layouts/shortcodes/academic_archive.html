<div class="academic-archive" data-academic-archive>
  <div class="academic-toolbar" aria-label="Filtrering af publikationer">
    <button class="academic-filter academic-filter--active" type="button" data-filter-all>Alle 25 værker</button>
    <span class="academic-filter-status" data-filter-status aria-live="polite">Viser alle værker</span>
  </div>
  <div class="academic-grid">
    {{ range site.Data.academic_books }}
    <article class="academic-card" data-academic-card data-tags="{{ delimit .tags "|" }}">
      <a class="academic-cover-link" href="{{ .pdf | safeURL }}" target="_blank" rel="noopener" aria-label="Læs {{ .title }} som PDF">
        <img class="academic-cover" src="{{ .cover | safeURL }}" alt="Forside til {{ .title }}" loading="lazy" width="640" height="905">
      </a>
      <div class="academic-card-body">
        <div class="academic-number">Værk {{ .number }}</div>
        <h2 class="academic-title">{{ .title }}</h2>
        <p class="academic-description">{{ .description }}</p>
        <div class="academic-tags" aria-label="Emner">
          {{ range .tags }}<button class="academic-tag" type="button" data-filter-tag="{{ . }}">{{ . }}</button>{{ end }}
        </div>
        <div class="academic-actions">
          <a href="{{ .pdf | safeURL }}" target="_blank" rel="noopener">Læs PDF</a>
          <a href="{{ .pdf | safeURL }}" download>Download</a>
        </div>
      </div>
    </article>
    {{ end }}
  </div>
</div>

<style>
.academic-archive{--archive-line:#e5e5e5;--archive-muted:#666;margin-top:2.5rem}.academic-toolbar{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:0 0 1.5rem;margin-bottom:2rem;border-bottom:1px solid var(--archive-line)}.academic-filter,.academic-tag{appearance:none;border:1px solid #d7d7d7;background:#fff;color:#222;font:inherit;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}.academic-filter{padding:.5rem .8rem;font-size:.82rem}.academic-filter--active,.academic-filter:hover,.academic-tag:hover,.academic-tag--active{background:#111;color:#fff;border-color:#111}.academic-filter-status{color:var(--archive-muted);font-size:.86rem}.academic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.6rem 2rem}.academic-card{min-width:0;display:flex;flex-direction:column;border-top:1px solid #1e1e1e;padding-top:.8rem}.academic-card[hidden]{display:none}.academic-cover-link{display:block;background:#f5f5f5;border:1px solid var(--archive-line);overflow:hidden;aspect-ratio:210/297;margin-bottom:1.1rem}.academic-cover{width:100%;height:100%;object-fit:contain;display:block;background:#fafafa;transition:transform .18s ease}.academic-cover-link:hover .academic-cover{transform:scale(1.015)}.academic-card-body{display:flex;flex:1;flex-direction:column}.academic-number{color:var(--archive-muted);font-size:.72rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;margin-bottom:.4rem}.academic-title{margin:0 0 .55rem;font-size:1.15rem;line-height:1.28;letter-spacing:-.012em}.academic-description{color:#555;font-size:.91rem;line-height:1.55;margin:0 0 1rem}.academic-tags{display:flex;flex-wrap:wrap;gap:.38rem;margin:auto 0 1.1rem}.academic-tag{border-radius:999px;padding:.26rem .56rem;font-size:.72rem;line-height:1.25}.academic-actions{display:flex;gap:1.1rem;padding-top:.8rem;border-top:1px solid var(--archive-line)}.academic-actions a{color:#111;font-size:.82rem;font-weight:650;text-decoration:none}.academic-actions a:hover{text-decoration:underline;text-underline-offset:3px}@media(max-width:900px){.academic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.academic-grid{grid-template-columns:1fr;gap:2.4rem}}
</style>
<style>
.academic-archive{margin-left:50%;width:min(1120px,calc(100vw - 2rem));transform:translateX(-50%)}
.academic-grid{gap:2.8rem 2.4rem}
</style>
<script>
(()=>{const root=document.querySelector('[data-academic-archive]');if(!root||root.dataset.ready)return;root.dataset.ready='true';const cards=[...root.querySelectorAll('[data-academic-card]')],all=root.querySelector('[data-filter-all]'),status=root.querySelector('[data-filter-status]'),tags=[...root.querySelectorAll('[data-filter-tag]')];const showAll=()=>{cards.forEach(c=>c.hidden=false);tags.forEach(b=>b.classList.remove('academic-tag--active'));all.classList.add('academic-filter--active');status.textContent='Viser alle 25 værker'};const filterBy=tag=>{let visible=0;cards.forEach(c=>{const match=c.dataset.tags.split('|').includes(tag);c.hidden=!match;if(match)visible++});tags.forEach(b=>b.classList.toggle('academic-tag--active',b.dataset.filterTag===tag));all.classList.remove('academic-filter--active');status.textContent=`${visible} ${visible===1?'værk':'værker'} om “${tag}”`;root.scrollIntoView({behavior:'smooth',block:'start'})};all.addEventListener('click',showAll);tags.forEach(b=>b.addEventListener('click',()=>filterBy(b.dataset.filterTag)))})();
</script>
